name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Format Check
        run: if [ -n "$(go fmt ./...)" ]; then echo "Code not formatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race ./...

      - name: Build cross-platform
        run: bash scripts/build.sh
